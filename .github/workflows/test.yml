name: Test PR

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download cached package
        uses: actions/download-artifact@v4
        with:
          name: cache-package

      - name: Run tests
        run: npm test
